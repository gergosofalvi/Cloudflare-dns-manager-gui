name: Build and Upload macOS ARM .pkg

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Szemantikus verzió tag pl. 0.4.0 vagy 1.2.3

jobs:
  build-macos-arm:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Write version to APP_VERSION.txt
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "$VERSION" > APP_VERSION.txt

      - name: Build app and pkg
        run: |
          VERSION=$(cat APP_VERSION.txt)
          pyinstaller --windowed --noconfirm --clean \
            --name "Cloudflare DNS Manager" \
            --icon Cloudflare32px.icns \
            --add-data "Cloudflare32px.png:." \
            --add-data "Cloudflare32px_gray.png:." \
            kivyapp.py
          rm -rf pkgroot/Applications/Cloudflare\ DNS\ Manager.app
          mkdir -p pkgroot/Applications
          cp -R "dist/Cloudflare DNS Manager.app" pkgroot/Applications/
          PKG_NAME="CloudflareDNSManager_${VERSION}.pkg"
          pkgbuild --root pkgroot --install-location / --identifier com.cloudflare.dnsmanager --version "$VERSION" "$PKG_NAME"
          echo "PKG_PATH=$PKG_NAME" >> $GITHUB_ENV
          echo "APP_PATH=dist/Cloudflare DNS Manager.app" >> $GITHUB_ENV

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload .pkg and .app to update server
        env:
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
          PKG_PATH: ${{ env.PKG_PATH }}
          APP_PATH: ${{ env.APP_PATH }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "$PKG_PATH" ] || [ -z "$APP_PATH" ]; then
            echo "No .pkg or .app file found!"
            exit 1
          fi
          curl -X POST https://cfdnsmanager.geri.app/upload \
            -F "key=$UPLOAD_KEY" \
            -F "version=$VERSION" \
            -F "pkg=@$PKG_PATH" \
            -F "app=@$APP_PATH"

      - name: Upload .pkg and .app to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG_PATH }}
            "${{ env.APP_PATH }}" 