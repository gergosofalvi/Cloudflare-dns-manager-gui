name: Build and Upload macOS ARM .pkg

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - 'build/*'

jobs:
  build-macos-arm:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Get version from branch or tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/heads/build/* ]]; then
            VERSION=${GITHUB_REF#refs/heads/build/}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION" > APP_VERSION.txt

      - name: Set version in kivyapp.py
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          sed -i '' "s/^APP_VERSION = .*/APP_VERSION = \"$VERSION\"  # Ez a sor lesz build előtt cserélve/" kivyapp.py

      - name: Build app and pkg
        run: |
          VERSION=$(cat APP_VERSION.txt)
          pyinstaller --windowed --noconfirm --clean \
            --name "Cloudflare DNS Manager" \
            --icon Cloudflare32px.icns \
            --add-data "Cloudflare32px.png:." \
            --add-data "Cloudflare32px_gray.png:." \
            kivyapp.py
          rm -rf pkgroot/Applications/Cloudflare\ DNS\ Manager.app
          mkdir -p pkgroot/Applications
          cp -R "dist/Cloudflare DNS Manager.app" pkgroot/Applications/
          PKG_NAME="CloudflareDNSManager_${VERSION}.pkg"
          pkgbuild --root pkgroot --install-location / --identifier com.cloudflare.dnsmanager --version "$VERSION" "$PKG_NAME"
          echo "PKG_PATH=$PKG_NAME" >> $GITHUB_ENV
          echo "APP_PATH=dist/Cloudflare DNS Manager.app" >> $GITHUB_ENV

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r "Cloudflare DNS Manager.app.zip" "Cloudflare DNS Manager.app"
          echo "APP_ZIP_PATH=dist/Cloudflare DNS Manager.app.zip" >> $GITHUB_ENV

      - name: Create and push tag if on build/* branch
        if: startsWith(github.ref, 'refs/heads/build/')
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Upload .pkg and .app.zip to update server
        env:
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
          PKG_PATH: ${{ env.PKG_PATH }}
          APP_ZIP_PATH: ${{ env.APP_ZIP_PATH }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "$PKG_PATH" ] || [ -z "$APP_ZIP_PATH" ]; then
            echo "No .pkg or .app.zip file found!"
            exit 1
          fi
          curl -X POST https://cfdnsmanager.geri.app/upload \
            -F "key=$UPLOAD_KEY" \
            -F "version=$VERSION" \
            -F "pkg=@$PKG_PATH" \
            -F "app=@$APP_ZIP_PATH" 